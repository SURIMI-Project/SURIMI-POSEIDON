!!uk.ac.ox.poseidon.core.Scenario
components:
  modelGrid: &id003 !!uk.ac.ox.poseidon.geography.grids.ModelGridWithActiveCellsFactory
    activeCells: !!uk.ac.ox.poseidon.geography.grids.CellSetFromGridFileFactory
      includedValue: 0.0
      modelGrid: &id002 !!uk.ac.ox.poseidon.geography.grids.ModelGridFromGridFileFactory
        gridFilePath: &id004 !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
          parent: &id001 !!uk.ac.ox.poseidon.io.paths.RootPathFactory {
            path: inputs/anchovy_bay
          }
          path: bathymetry_grid.asc
      path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
        parent: *id001
        path: exclusion_grid.asc
    modelGrid: *id002
  bathymetricGrid: &id005 !!uk.ac.ox.poseidon.geography.bathymetry.BathymetricGridFromGridFileFactory
    aggregator: !!uk.ac.ox.poseidon.core.aggregators.MaxAggregatorFactory {
      }
    inverted: false
    modelGrid: *id003
    path: *id004
  portGrid: &id006 !!uk.ac.ox.poseidon.geography.ports.PortGridFactory
    bathymetricGrid: *id005
    distanceCalculator: !!uk.ac.ox.poseidon.geography.distance.HaversineDistanceCalculatorFactory
      modelGrid: *id003
    ports: !!uk.ac.ox.poseidon.geography.ports.PortsFromTableFactory
      latitudeColumnName: lat
      longitudeColumnName: lon
      portCodeColumnName: port_code
      portNameColumnName: port_name
      table: !!uk.ac.ox.poseidon.io.tables.TableFromCsvFactory
        dataSource: !!uk.ac.ox.poseidon.io.sources.FileDataSourceFactory
          encoding: UTF-8
          path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
            parent: *id001
            path: ports.csv
  marketGrid: !!uk.ac.ox.poseidon.fishing.market.MarketGridFactory
    markets: !!uk.ac.ox.poseidon.fishing.market.OneBiomassMarketPerPortFactory
      currencyCode: EUR
      eventManager: !!uk.ac.ox.poseidon.core.EventManagerFactory {
        }
      portGrid: *id006
    portGrid: *id006
  species: &id007 !!uk.ac.ox.poseidon.biology.species.SpeciesFromDataFactory
    data: !!uk.ac.ox.poseidon.io.tables.TableFromCsvFactory
      dataSource: !!uk.ac.ox.poseidon.io.sources.FileDataSourceFactory
        encoding: UTF-8
        path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
          parent: *id001
          path: species.csv
    lifeStageColumn: life_stage
    speciesCodeColumn: species_code
    speciesNameColumn: species_name
  biomassGrids: &id008 !!uk.ac.ox.poseidon.biology.biomass.BiomassGridsFactory
    biomassAllocators: !!uk.ac.ox.poseidon.core.utils.ListFactory
      factories:
      - !!uk.ac.ox.poseidon.geography.allocators.FilteredAllocatorFactory
        cellPredicate: !!uk.ac.ox.poseidon.geography.predicates.IsActiveWaterCellFactory
          bathymetricGrid: *id005
        delegateAllocator: !!uk.ac.ox.poseidon.geography.allocators.SupplierAllocatorFactory
          value: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
            object: !!uk.ac.ox.poseidon.core.utils.ObjectFactory {
              value: 0.0
            }
    modelGrid: *id003
    species: *id007
  fisheableBiomassGrids: !!uk.ac.ox.poseidon.biology.biomass.FisheableBiomassGridsFactory
    biomassGrids: *id008
startingDateTime: !!uk.ac.ox.poseidon.core.time.DateTimeFactory {
  day: 1,
  hour: 0,
  minute: 0,
  month: 1,
  second: 0,
  year: 2000
}
