!!uk.ac.ox.poseidon.core.Scenario
components:
  modelGrid: &id002 !!eu.project.surimi.poseidon.ewe.ModelGridFromEcospaceBasemapFactory
    ecospaceBasemap: &id001 !!eu.project.surimi.poseidon.ewe.EcospaceBasemapFromTableFactory
      ecospaceScenarioName: BayOfAnchovies
      table: !!eu.project.surimi.poseidon.ewe.EweTableFactory
        eweDatabase: &id004 !!eu.project.surimi.poseidon.ewe.EweDatabaseFactory
          path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
            parent: !!uk.ac.ox.poseidon.io.paths.RootPathFactory {
              path: inputs/anchovy_bay
            }
            path: anchovy_bay.eiixml
        tableName: EcospaceScenario
  bathymetricGrid: &id003 !!eu.project.surimi.poseidon.ewe.BathymetricGridFromEcospaceBasemapFactory
    ecospaceBasemap: *id001
    modelGrid: *id002
  portGrid: !!uk.ac.ox.poseidon.geography.ports.PortGridFactory
    bathymetricGrid: *id003
    distanceCalculator: !!uk.ac.ox.poseidon.geography.distance.HaversineDistanceCalculatorFactory
      modelGrid: *id002
    ports: !!uk.ac.ox.poseidon.geography.ports.PortsFromCellsFactory
      cells: !!eu.project.surimi.poseidon.ewe.EcospacePortCellsFromTableFactory
        ecospaceBasemap: *id001
        table: !!eu.project.surimi.poseidon.ewe.EweTableFactory
          eweDatabase: *id004
          tableName: EcospaceScenarioFleet
      code: !!uk.ac.ox.poseidon.core.utils.PrefixedIdFactory {
        prefix: P
      }
      modelGrid: *id002
  species: &id006 !!eu.project.surimi.poseidon.ewe.SpeciesFromEcopathSpeciesMappingFactory
    ecopathSpeciesMapping: &id005 !!eu.project.surimi.poseidon.ewe.EcopathSpeciesMappingFromGroupsFactory
      groups: !!eu.project.surimi.poseidon.ewe.FilteredEcopathGroupsFactory
        groups: !!eu.project.surimi.poseidon.ewe.EcopathGroupsFromTableFactory
          table: !!eu.project.surimi.poseidon.ewe.EweTableFactory
            eweDatabase: *id004
            tableName: EcopathGroup
        predicate: !!eu.project.surimi.poseidon.ewe.CaughtInEcopathFactory
          ecopathCatches: !!eu.project.surimi.poseidon.ewe.EcopathCatchesFromTableFactory
            table: !!eu.project.surimi.poseidon.ewe.EweTableFactory
              eweDatabase: *id004
              tableName: EcopathCatch
  biomassGrids: !!uk.ac.ox.poseidon.biology.biomass.BiomassGridsFactory
    biomassAllocators: !!eu.project.surimi.poseidon.ewe.BiomassAllocatorsFromEcospaceFactory
      cellAreaCalculator: !!uk.ac.ox.poseidon.geography.areas.SphericalCellAreaCalculatorFactory
        modelGrid: *id002
      ecopathBiomasses: !!eu.project.surimi.poseidon.ewe.EcopathBiomassesFromTableFactory
        table: !!eu.project.surimi.poseidon.ewe.EweTableFactory
          eweDatabase: *id004
          tableName: EcopathGroup
      ecopathSpeciesMapping: *id005
      ecospaceBasemap: *id001
      ecospaceGroups: !!eu.project.surimi.poseidon.ewe.EcospaceGroupsFromTableFactory
        ecospaceBasemap: *id001
        table: !!eu.project.surimi.poseidon.ewe.EweTableFactory
          eweDatabase: *id004
          tableName: EcospaceScenarioGroup
      ecospaceHabitats: !!eu.project.surimi.poseidon.ewe.EcospaceHabitatsFromTablesFactory
        ecospaceBasemap: *id001
        groupHabitatTable: !!eu.project.surimi.poseidon.ewe.EweTableFactory
          eweDatabase: *id004
          tableName: EcospaceScenarioGroupHabitat
        habitatTable: !!eu.project.surimi.poseidon.ewe.EweTableFactory
          eweDatabase: *id004
          tableName: EcospaceScenarioHabitat
      species: *id006
    modelGrid: *id002
    species: *id006
startingDateTime: !!uk.ac.ox.poseidon.core.time.DateTimeFactory {
  day: 1,
  hour: 0,
  minute: 0,
  month: 1,
  second: 0,
  year: 1970
}
