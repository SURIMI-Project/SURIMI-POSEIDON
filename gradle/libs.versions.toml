[versions]
assertj = "3.27.7"
caffeine = "3.2.3"
checkstyle = "14.3.0"
freefair = "9.8.2"
grpc = "1.82.0"
jackson2 = "2.18.11" # build classpath only, via node-gradle
lombok = "1.18.46"
opentelemetry-core = "1.62.0"
opentelemetry-instrumentation = "2.14.0-alpha"
spotbugs = "6.5.12"
spotless = "8.10.4"
jcommander = "2.0"
junit = "5.14.3"
jqwik = "1.9.3"
mockito = "5.23.0"
node-gradle = "7.1.0"
nodejs = "24.14.0"
commons-beanutils = "1.11.0"
commons-io = "2.22.0"
protovalidate = "1.2.2"
awssdk = "2.55.11"
gson = "2.14.0"
sqlite-jdbc = "3.53.4.0"

[libraries]
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
commons-beanutils = { module = "commons-beanutils:commons-beanutils", version.ref = "commons-beanutils" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry-core" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry-core" }
opentelemetry-grpc-server = { module = "io.opentelemetry.instrumentation:opentelemetry-grpc-1.6", version.ref = "opentelemetry-instrumentation" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry-core" }
jcommander = { module = "org.jcommander:jcommander", version.ref = "jcommander" }
junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
protovalidate = { module = "build.buf:protovalidate", version.ref = "protovalidate" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
aws-url-connection-client = { module = "software.amazon.awssdk:url-connection-client", version.ref = "awssdk" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[bundles]
opentelemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-grpc-server"
]

[plugins]
freefair-lombok = { id = "io.freefair.lombok", version.ref = "freefair" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
