# Builds the Javadoc and publishes it to GitHub Pages.
# For more information see: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site#publishing-with-a-custom-github-actions-workflow

name: Publish Javadoc

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  javadoc:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        lfs: true
        token: ${{ secrets.POSEIDON_PAT }}

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Generate Javadoc
      run: ./gradlew javadoc

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/docs/javadoc

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
