# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Runs on main must not overlap, or two of them could compute the same version for different commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          lfs: true
          token: ${{ secrets.POSEIDON_PAT }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle Wrapper and check the Javadoc
        env:
          # For S3InputsIntegrationTest, which is skipped when they are absent (e.g. on forks)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: ./gradlew build javadoc

      - name: Install GitVersion
        if: github.event_name == 'push'
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.4.0'

      - name: Run GitVersion
        if: github.event_name == 'push'
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0
        with:
          overrideConfig: |
            workflow=TrunkBased/preview1
            commit-message-incrementing=Enabled
            tag-prefix=v
            increment=Patch

      - name: Create git tag
        # Before the image push, so a version already tagged on another commit fails the run instead
        # of overwriting that version's image. Pushing a tag that already points to this commit succeeds.
        # The checkout's credentials are POSEIDON_PAT, which cannot write to this repository: clear them
        # and push with GITHUB_TOKEN instead.
        if: github.event_name == 'push'
        run: >
          git -c http.https://github.com/.extraheader=
          push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          "HEAD:refs/tags/v${{ steps.gitversion.outputs.SemVer }}"

      - name: Log in to GHCR
        # Only pushes to main publish the image, not pull requests
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image via Gradle
        if: github.event_name == 'push'
        run: ./gradlew pushDockerImage -PdockerImageVersion="${{ steps.gitversion.outputs.SemVer }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true
